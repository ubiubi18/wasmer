name: Fork CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-cursor0 libxkbcommon-dev libwayland-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check core API
        env:
          RUSTFLAGS: -Dunpredictable-function-pointer-comparisons -Dstatic-mut-refs -Dfunction-casts-as-integer
        run: cargo check -p wasmer --no-default-features --features compiler,universal,singlepass

      - name: Check headless CLI
        run: cargo check -p wasmer-cli --no-default-features --features headless-minimal,wasmer/sys

      - name: Check C API
        run: cargo check -p wasmer-c-api --no-default-features --features compiler,singlepass,universal

      - name: Check compiler CLI
        run: cargo check -p wasmer-compiler-cli --no-default-features --features singlepass

      - name: Check cache benches
        run: cargo check -p wasmer-cache --benches

      - name: Link VM tests
        run: cargo test -p wasmer-vm --lib

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit
        run: cargo audit
