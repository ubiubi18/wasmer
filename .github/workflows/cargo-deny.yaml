on:
  pull_request:
  push:
    branches:
      - vibe/clean-modern-fork
  workflow_dispatch:

name: cargo-deny

permissions:
  contents: read

jobs:
  deny-check:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
